name: CAAS Evidence Refresh

# Refreshes the suite-root assurance_report.json plus the library-side
# EXTERNAL_AUDIT_BUNDLE.json / .sha256 / SECURITY_AUTONOMY_KPI.json so that
# the audit_sla_check.py 30-day max_stale_evidence_days SLO never silently
# trips (CAAS Hardening TODO H-1).
#
# Evidence-refresh coverage contract (Bastion B19, docs/AUDIT_SLA.json
# `freshness_artifacts`, gated by ci/check_evidence_refresh_coverage.py / G-19):
#   AUTO (refreshed + committed by this lane):
#     - assurance_report   (out/reports/assurance_report.json via export_assurance.py)
#     - incident_drill_log (docs/INCIDENT_DRILL_LOG.json — security_autonomy_check.py
#                           runs incident_drills.py, which rewrites the log)
#     - ct_evidence (audit/ci-evidence), determinism_golden, api_contracts and
#       assurance_claims, plus the INT-SHIM-PARITY row of docs/INTEGRATION_EVIDENCE_STATUS.json
#       — owner decision 2026-11-02 (RR-BAS-01). Each is refreshed ONLY by re-running its
#       real verifier and written ONLY when that verifier passes (ci/refresh_residual_evidence.py):
#       a failed group writes nothing, and nothing it produced is committed unless the whole
#       lane is green. A group is due once its artifact is 7 days old, so the second build
#       below runs about once a week, not nightly.
#   RESIDUAL (intentionally NOT refreshed here; see docs/RESIDUAL_RISK_REGISTER.md RR-BAS-01):
#     - risk_coverage_report (a build-only artifact under the gitignored out/ tree)
#     - owner-gated evidence (GPU hardware, ROCm, Bitcoin Core suite, libbitcoin bridge):
#       a GitHub-hosted runner cannot produce it, and this lane never writes or stamps it.
#   The "Verify evidence-refresh coverage" step below fails the lane if a blocking
#   freshness artifact ever loses both its auto-producer and its documented residual.
#
# Scheduled runs use the copy of this workflow on the default branch (main), so the schedule
# picks the residual refresh up at the next release. Until then run it from dev:
#   gh workflow run caas-evidence-refresh.yml --ref dev
# (add `-f force_residual_refresh=true` to refresh artifacts younger than 7 days).
#
# Safe: only commits when something actually changed, and only on dev.

on:
  # Daily refresh at 04:30 UTC. Documented in docs/CAAS_HARDENING_TODO.md (H-1)
  # and depended on by audit_sla_check.py max_stale_evidence_days SLO.
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      force_commit:
        description: 'Commit even if no JSON changed (touches mtime via no-op edit)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      force_residual_refresh:
        description: 'Refresh the residual evidence (CT/fuzz snapshots, determinism golden, API-contract / assurance-claim / shim-parity stamps) even if it is younger than 7 days; every group still needs its verifier to pass'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

# Top-level permissions restricted to read-only (Scorecard
# TokenPermissionsID). Only the `refresh` job needs contents:write in
# order to push the refreshed evidence JSONs back to dev, so that scope
# is granted at the job level below.
permissions:
  contents: read

concurrency:
  group: caas-evidence-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh CAAS evidence on dev
    runs-on: ubuntu-24.04
    # 25 minutes was the budget before the residual refresh. It now also covers a second
    # configure + compile of the core library with the audit/fuzz targets (only on the nights
    # the CT evidence is due) and the five suite runs, each of which ci/refresh_residual_evidence.py
    # bounds at 5-15 minutes. A budget, not a measurement: raise it if a first run shows more.
    timeout-minutes: 90
    if: github.repository == 'shrec/UltrafastSecp256k1'
    # Needs write to push refreshed evidence JSONs back to the dev branch.
    permissions:
      contents: write
      actions: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Report evidence refresh token mode
        # CAAS_BOT_TOKEN is preferred when the dev branch requires bypass
        # permissions. If it is absent, continue with GITHUB_TOKEN so the lane can
        # still regenerate diagnostics and upload artifacts; the final commit step
        # remains fail-closed if refreshed evidence cannot be written to dev.
        run: |
          if [ -z "${{ secrets.CAAS_BOT_TOKEN }}" ]; then
            echo "::warning::CAAS_BOT_TOKEN secret is not configured; falling back to GITHUB_TOKEN."
            echo "::warning::If dev branch protection rejects the commit, the commit step will fail after diagnostic artifacts are uploaded."
          else
            echo "::notice::Using CAAS_BOT_TOKEN for evidence refresh checkout and push."
          fi

      - name: Checkout dev
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.CAAS_BOT_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Verify evidence-refresh coverage (G-19)
        # Bastion B19: fail the lane fast (before the build) if any freshness
        # artifact tracked by audit_sla_check.py has lost both its auto-producer
        # and its documented residual, or if an `auto` disposition claims a commit
        # path this workflow does not actually stage. Cheap: static JSON + workflow
        # parsing, no build required.
        run: python3 ci/check_evidence_refresh_coverage.py

      - name: Install build dependencies
        run: sudo apt-get install -y --no-install-recommends ninja-build g++-14

      - name: Build shared library (required by gates inside the bundle)
        run: |
          cmake -S . -B out/ci-audit -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DBUILD_TESTING=OFF \
            -DSECP256K1_BUILD_PROTOCOL_TESTS=OFF \
            -DSECP256K1_BUILD_FUZZ_TESTS=OFF
          cmake --build out/ci-audit --target ufsecp_shared -j $(nproc)

      - name: Build project graph
        run: python3 ci/build_project_graph.py --rebuild

      - name: Build source graph
        run: python3 tools/source_graph_kit/source_graph.py build -i

      - name: Plan residual evidence refresh
        id: residual_plan
        # Which residual groups are due: at least --min-age-days old by audit_sla_check.py's
        # own age function, or forced. Runs nothing and writes nothing. The three residual
        # steps are continue-on-error so a failure in them cannot stop the rest of the lane;
        # their outcomes feed GATE_VERDICT and the last step of the job turns a failure into
        # a red lane.
        continue-on-error: true
        env:
          FORCE_RESIDUAL: ${{ github.event.inputs.force_residual_refresh }}
        run: |
          mkdir -p out/residual-evidence
          ARGS=()
          if [ "${FORCE_RESIDUAL}" = "true" ]; then ARGS+=(--force); fi
          python3 ci/refresh_residual_evidence.py --plan "${ARGS[@]}" > out/residual-evidence/plan.json
          cat out/residual-evidence/plan.json
          python3 - out/residual-evidence/plan.json >> "$GITHUB_OUTPUT" <<'EOF'
          import json, sys
          plan = json.load(open(sys.argv[1], encoding="utf-8"))
          print("needs_test_build=" + ("true" if plan["needs_test_build"] else "false"))
          EOF

      - name: Build audit and fuzz binaries (only when CT evidence is due)
        id: residual_build
        if: steps.residual_plan.outputs.needs_test_build == 'true'
        # A second build directory: the one above is BUILD_TESTING=OFF. Only the five suites
        # whose output becomes audit/ci-evidence/<suite>_<YYYYMMDD>.txt are built, and only
        # when the plan says the CT evidence is due, so most nights this step is skipped. A
        # failed build leaves binaries missing, which fails the ct_evidence group (nothing
        # is written).
        continue-on-error: true
        run: |
          cmake -S . -B out/ci-evidence-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DBUILD_TESTING=ON \
            -DSECP256K1_BUILD_FUZZ_TESTS=ON
          cmake --build out/ci-evidence-build -j $(nproc) --target \
            test_adversarial_protocol_standalone \
            test_ecies_regression_standalone \
            test_regression_ct_ops_standalone \
            test_fuzz_parsers \
            test_fuzz_address_bip32_ffi

      - name: Refresh residual evidence (ci/refresh_residual_evidence.py)
        id: residual_evidence
        # RR-BAS-01. Each group is refreshed ONLY by re-running its real verifier and written
        # ONLY when that verifier passes; a failed group writes nothing and the others still
        # refresh. Runs before the assurance report, the bundle and the KPI so they see the
        # current files. --lib points the determinism gate at the shared library built above.
        continue-on-error: true
        env:
          FORCE_RESIDUAL: ${{ github.event.inputs.force_residual_refresh }}
        run: |
          mkdir -p out/residual-evidence
          ARGS=()
          if [ "${FORCE_RESIDUAL}" = "true" ]; then ARGS+=(--force); fi
          rc=0
          python3 ci/refresh_residual_evidence.py \
            --build-dir out/ci-evidence-build \
            --lib out/ci-audit \
            "${ARGS[@]}" > out/residual-evidence/summary.json || rc=$?
          cat out/residual-evidence/summary.json
          exit "$rc"

      - name: Regenerate suite-root assurance_report.json
        id: assurance_report
        # The library script writes wherever -o points. The suite-root file
        # is what audit_sla_check.py treats as the "assurance_report" SLO
        # input (scope=suite).
        run: |
          python3 ci/export_assurance.py -o assurance_report.json
          # F-27 fix: use a more reliable monorepo detection heuristic.
          # `../../` always exists on Linux; the AGENTS.md check was the only guard
          # and would break if that file was renamed. Instead, check for the parent
          # workspace's pyproject.toml or CMakeLists.txt at a known relative path,
          # or fall back to checking AGENTS.md still (belt-and-suspenders).
          _suite_root="$(cd ../.. && pwd)"
          if [ -f "${_suite_root}/AGENTS.md" ] || \
             [ -f "${_suite_root}/pyproject.toml" ] || \
             [ -f "${_suite_root}/CMakeLists.txt" ]; then
            if [ "$(basename "${_suite_root}")" != "$(basename "$(cd .. && pwd)")" ]; then
              cp assurance_report.json "${_suite_root}/assurance_report.json" \
                || echo "::warning::Failed to copy assurance_report.json to suite root ${_suite_root}"
            fi
          fi

      - name: Regenerate external audit bundle
        id: bundle_verify
        run: |
          python3 ci/external_audit_bundle.py
          BUNDLE_VERIFY_JSON="${{ runner.temp }}/bundle_verify.json"
          python3 ci/verify_external_audit_bundle.py --json > "$BUNDLE_VERIFY_JSON"
          python3 - "$BUNDLE_VERIFY_JSON" <<'EOF'
          import json, sys
          with open(sys.argv[1]) as f:
              r = json.load(f)
          if not r.get('overall_pass', False):
              print('::error::Bundle verify FAILED — aborting evidence refresh commit')
              sys.exit(1)
          else:
              print('::notice::Bundle verify PASS')
          EOF

      - name: Refresh security autonomy KPI snapshot
        id: autonomy_kpi
        run: |
          python3 ci/security_autonomy_check.py --json -o docs/SECURITY_AUTONOMY_KPI.json

      - name: Check exploit wiring (OBS-2 — ensure bundle reflects wiring state)
        id: exploit_wiring
        run: python3 ci/check_exploit_wiring.py

      - name: Regenerate audit dashboard (H-9)
        # Hard-fail: render_audit_dashboard.py only reads local JSON + git log
        # and must always succeed. A failure here means a schema regression in
        # one of its input files; allowing a stale dashboard to be committed
        # silently was masking the bug.
        run: python3 ci/render_audit_dashboard.py -o docs/AUDIT_DASHBOARD.md

      - name: Restore audit trend DB cache
        id: trend_cache
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: out/artifact_analyzer.db
          key: audit-trend-db-${{ runner.os }}-${{ hashFiles('ci/artifact_analyzer.py') }}
          restore-keys: audit-trend-db-${{ runner.os }}-

      - name: Ingest audit reports into trend DB and export timeline
        # Wire artifact_analyzer.py into the nightly refresh so audit quality
        # trends are tracked automatically across runs (MEDIUM-6 fix).
        # The DB is cached across runs; the exported timeline JSON is committed.
        # CAAS-004 fix: removed continue-on-error and || echo double-silencing.
        # Ingest failure is advisory (schema mismatch won't break CI); export
        # failure is hard (corrupt timeline cannot be committed).
        run: |
          mkdir -p out
          # CI-004: treat ingest failure as hard error — a masked ingest silently
          # corrupts the trend DB and allows stale KPI values to appear current.
          python3 ci/artifact_analyzer.py \
            --db out/artifact_analyzer.db \
            ingest assurance_report.json docs/SECURITY_AUTONOMY_KPI.json \
            || { echo "::error::artifact_analyzer ingest failed (schema mismatch or import error) — aborting to prevent stale/corrupt trend DB commit"; exit 1; }
          python3 ci/artifact_analyzer.py \
            --db out/artifact_analyzer.db \
            export --format timeline \
            --output docs/AUDIT_TREND_TIMELINE.json \
            || { echo "::error::artifact_analyzer timeline export failed — aborting to prevent corrupt timeline commit"; exit 1; }
          # AA-05 fix: validate timeline JSON before it can be committed.
          # A failed export may produce an empty or truncated file; committing
          # it would corrupt the trend history visible in dashboards.
          python3 ci/validate_timeline.py || { echo "::error::timeline validation failed — aborting commit to protect trend history"; exit 1; }

      - name: Regenerate exploit traceability join (G-9b)
        run: |
          python3 ci/exploit_traceability_join.py --emit-join

      - name: Show diff
        run: |
          git --no-pager diff --stat -- \
            assurance_report.json \
            docs/EXTERNAL_AUDIT_BUNDLE.json \
            docs/EXTERNAL_AUDIT_BUNDLE.sha256 \
            docs/SECURITY_AUTONOMY_KPI.json \
            docs/AUDIT_DASHBOARD.md \
            docs/EXPLOIT_TRACEABILITY_JOIN.md \
            docs/AUDIT_TREND_TIMELINE.json \
            docs/API_SECURITY_CONTRACTS.json \
            docs/ASSURANCE_CLAIMS.json \
            docs/DETERMINISM_GOLDEN.json \
            docs/INTEGRATION_EVIDENCE_STATUS.json \
            || true
          echo "New residual CT/fuzz snapshots (untracked, so not in the diff above):"
          git ls-files --others --exclude-standard -- audit/ci-evidence

      - name: Upload refreshed artifacts (diagnostic fallback if push fails)
        # B-4 fix: if the git push fails (PAT revoked, branch protection error),
        # regenerated evidence would otherwise be lost with no way to inspect it.
        # Upload as a GitHub Actions artifact so the data is always recoverable.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: caas-evidence-refresh-${{ github.run_id }}
          path: |
            assurance_report.json
            docs/EXTERNAL_AUDIT_BUNDLE.json
            docs/EXTERNAL_AUDIT_BUNDLE.sha256
            docs/SECURITY_AUTONOMY_KPI.json
            docs/AUDIT_DASHBOARD.md
            docs/EXPLOIT_TRACEABILITY_JOIN.md
            docs/EVIDENCE_CHAIN.json
            audit/ci-evidence/
            docs/API_SECURITY_CONTRACTS.json
            docs/ASSURANCE_CLAIMS.json
            docs/DETERMINISM_GOLDEN.json
            docs/INTEGRATION_EVIDENCE_STATUS.json
            out/residual-evidence/
          if-no-files-found: warn
          retention-days: 90

      - name: Commit and push if changed
        id: commit_push
        env:
          # CAAS-009 fix: fall back to GITHUB_TOKEN when CAAS_BOT_TOKEN is not set.
          # Previously a missing/expired CAAS_BOT_TOKEN caused silent push failure,
          # leaving the dashboard and evidence chain stale indefinitely. The final
          # git push remains the authoritative hard-fail if branch protection
          # rejects the fallback token.
          GH_TOKEN: ${{ secrets.CAAS_BOT_TOKEN || github.token }}
          HAS_CAAS_BOT_TOKEN: ${{ secrets.CAAS_BOT_TOKEN != '' }}
          FORCE_COMMIT: ${{ github.event.inputs.force_commit }}
          CAAS_HMAC_KEY: ${{ secrets.CAAS_HMAC_KEY }}
        run: |
          set -e
          git config user.name  "caas-bot"
          git config user.email "caas-bot@users.noreply.github.com"
          # Configure remote to use token (works with both CAAS_BOT_TOKEN and GITHUB_TOKEN).
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/shrec/UltrafastSecp256k1.git"

          # M-1 fix: determine verdict from the outcomes of the gate steps.
          # Previously this was hardcoded "pass" unconditionally, meaning the
          # evidence chain recorded PASS even when bundle verify or autonomy
          # check failed. Now we propagate the real gate state.
          # F-14 fix: also check assurance_report step — a failed export_assurance.py
          # run should not produce a "pass" evidence chain entry.
          GATE_VERDICT="pass"
          # The residual evidence refresh (plan, build, refresh) is part of the verdict: a failed
          # group means evidence it would have refreshed is NOT current, so the run records
          # verdict=fail and the fail path below commits nothing but the chain record.
          if [ "${{ steps.bundle_verify.outcome }}" != "success" ] || \
             [ "${{ steps.autonomy_kpi.outcome }}" != "success" ] || \
             [ "${{ steps.exploit_wiring.outcome }}" != "success" ] || \
             [ "${{ steps.assurance_report.outcome }}" != "success" ] || \
             [ "${{ steps.residual_plan.outcome }}" != "success" ] || \
             [ "${{ steps.residual_build.outcome }}" = "failure" ] || \
             [ "${{ steps.residual_evidence.outcome }}" != "success" ]; then
            GATE_VERDICT="fail"
            echo "::warning::One or more gate steps failed; recording verdict=fail in evidence chain"
          fi

          # Record this refresh run in the evidence chain BEFORE checking what changed,
          # so the chain entry is always included in the commit (if anything else changed).
          # --commit pins the chain record to the audited HEAD SHA (FINDING-13 fix: previously
          # used git rev-parse HEAD at write time, which could differ from the audited commit
          # when commits are pushed between the schedule trigger and the actual run).
          if ! python3 ci/evidence_governance.py record \
            --who "caas-evidence-refresh" \
            --what "nightly-evidence-refresh" \
            --verdict "$GATE_VERDICT" \
            --commit "${{ github.sha }}" \
            --reason "automated-nightly-$(date -u +%Y-%m-%d)"; then
            echo "::error::evidence chain write failed during nightly refresh — chain integrity compromised"
            exit 1
          fi

          # CI-009: on failed gate runs, commit only EVIDENCE_CHAIN.json (recording the
          # failure). Do NOT commit assurance_report.json or KPI JSON on failure — those
          # would appear as "current" evidence with today's date while actually reflecting
          # a failed gate state, misleading future auditors who check file mtimes.
          CHANGED=0
          if [ "$GATE_VERDICT" = "fail" ]; then
            # Failure path: only persist the evidence chain record
            for f in docs/EVIDENCE_CHAIN.json; do
              if [ -f "$f" ] && ! git diff --quiet -- "$f"; then
                git add "$f"
                CHANGED=1
              fi
            done
          else
            # Success path: commit all evidence artifacts
            for f in assurance_report.json \
                     docs/EXTERNAL_AUDIT_BUNDLE.json \
                     docs/EXTERNAL_AUDIT_BUNDLE.sha256 \
                     docs/SECURITY_AUTONOMY_KPI.json \
                     docs/AUDIT_DASHBOARD.md \
                     docs/EXPLOIT_TRACEABILITY_JOIN.md \
                     docs/INCIDENT_DRILL_LOG.json \
                     docs/API_SECURITY_CONTRACTS.json \
                     docs/ASSURANCE_CLAIMS.json \
                     docs/DETERMINISM_GOLDEN.json \
                     docs/INTEGRATION_EVIDENCE_STATUS.json \
                     docs/EVIDENCE_CHAIN.json; do
              if [ -f "$f" ] && ! git diff --quiet -- "$f"; then
                git add "$f"
                CHANGED=1
              fi
            done
            # The residual refresh writes NEW dated snapshot files. They are untracked, which
            # `git diff --quiet` cannot see, so stage the directory whenever it holds any.
            if [ -n "$(git ls-files --others --exclude-standard -- audit/ci-evidence)" ]; then
              git add audit/ci-evidence
              CHANGED=1
            fi
          fi

          if [ "$CHANGED" -eq 0 ] && [ "${FORCE_COMMIT}" != "true" ]; then
            echo "::notice::No evidence changed; nothing to commit"
            exit 0
          fi

          if [ "${HAS_CAAS_BOT_TOKEN}" != "true" ]; then
            echo "::error::CAAS_BOT_TOKEN is required to commit refreshed evidence to protected dev. Regenerated artifacts were uploaded for diagnosis, but freshness is not updated until a bypass-capable token is provisioned."
            exit 1
          fi

          RESIDUAL_NOTE="$(python3 -c 'import json,sys; s=json.load(open(sys.argv[1])); print("Residual evidence: " + ", ".join(g["name"] + "=" + g["status"] for g in s["groups"]))' out/residual-evidence/summary.json 2>/dev/null || echo 'Residual evidence: no summary available')"
          git commit -m "[bot] CAAS evidence refresh ($(date -u +%Y-%m-%d))" \
                     -m "Automated nightly refresh of CAAS evidence artifacts so the audit_sla_check.py max_stale_evidence_days SLO cannot silently trip. Includes audit dashboard (H-9), exploit traceability join (G-9b), and evidence chain record. See docs/CAAS_HARDENING_TODO.md (H-1)." \
                     -m "The residual evidence (audit/ci-evidence CT and fuzz snapshots, determinism golden, API-contract and assurance-claim stamps, INT-SHIM-PARITY stamp) is refreshed only by re-running its real verifier and only when that verifier passes (ci/refresh_residual_evidence.py, RR-BAS-01). ${RESIDUAL_NOTE}."

          git push origin dev

      - name: Fail the lane when the residual evidence refresh failed
        # The plan, the build and the refresh are continue-on-error so one failed group cannot
        # stop the rest of the lane and the failure is recorded in the evidence chain above.
        # This step makes it loud instead of silently green; nothing the refresh produced was
        # committed on this path (the verdict was fail).
        if: always() && (steps.residual_plan.outcome == 'failure' || steps.residual_build.outcome == 'failure' || steps.residual_evidence.outcome == 'failure')
        run: |
          echo "::error::The residual evidence refresh failed (plan, build or refresh step); nothing it produced was committed. See that step's log and out/residual-evidence/summary.json in the uploaded caas-evidence-refresh artifact."
          exit 1
