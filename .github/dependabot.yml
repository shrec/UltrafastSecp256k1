version: 2

# target-branch is "dev" on every entry, deliberately.
#
# This repository's default branch is main, and main is the RELEASE branch: it
# only ever receives a merge from dev when a version is cut. Without this key
# dependabot aims at the default branch, so every update PR is opened against
# main -- a PR that cannot pass CI (it is built against the last release, not
# the current tree) and that must not be merged even if it did, because it
# would put an unreleased change on the release branch.
#
# Four such PRs (#403-#406) were opened against main and closed unmerged before
# this was added. See CONTRIBUTING.md for the two-branch policy.
updates:
  # ── GitHub Actions ──
  - package-ecosystem: "github-actions"
    target-branch: "dev"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"

  # ── npm: WASM package ──
  - package-ecosystem: "npm"
    target-branch: "dev"
    directory: "/bindings/wasm"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps"
      include: "scope"

  # ── npm: Node.js binding ──
  - package-ecosystem: "npm"
    target-branch: "dev"
    directory: "/bindings/nodejs"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps"
      include: "scope"

  # ── npm: React Native binding ──
  - package-ecosystem: "npm"
    target-branch: "dev"
    directory: "/bindings/react-native"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps"
      include: "scope"

  # ── NuGet: C# bindings ──
  - package-ecosystem: "nuget"
    target-branch: "dev"
    directory: "/bindings/csharp"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "csharp"
    commit-message:
      prefix: "deps"
      include: "scope"

  # ── Cargo: Rust bindings ──
  - package-ecosystem: "cargo"
    target-branch: "dev"
    directory: "/bindings/rust"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "deps"
      include: "scope"

  # ── pip: Python binding ──
  - package-ecosystem: "pip"
    target-branch: "dev"
    directory: "/bindings/python"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"

  # ── Gradle: Android example ──
  - package-ecosystem: "gradle"
    target-branch: "dev"
    directory: "/bindings/android/example"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "java"
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: nuget
    target-branch: "dev"
    directory: /bindings/csharp/Ufsecp
    schedule:
      interval: daily

  - package-ecosystem: nuget
    target-branch: "dev"
    directory: /bindings/csharp/UfsepcBenchmark
    schedule:
      interval: daily

  - package-ecosystem: nuget
    target-branch: "dev"
    directory: /bindings/csharp/UltrafastSecp256k1
    schedule:
      interval: daily

  - package-ecosystem: gomod
    target-branch: "dev"
    directory: /bindings/go
    schedule:
      interval: daily
